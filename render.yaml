services:
  - type: web
    name: akhil-mukesh-bot
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: "python -m uvicorn app.main:app --app-dir api --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
